<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - IronNest Fitness</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="auth">
  <form id="loginForm" class="auth-card" novalidate>
    <a href="index.html" class="brand text-decoration-none text-dark">IronNest</a>
    <h4 class="mt-2 mb-3">Welcome back</h4>
    <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" type="email" class="form-control" required><div class="invalid-feedback">Enter a valid email address.</div></div>
    <div class="mb-3"><label for="pass" class="form-label">Password</label><input id="pass" type="password" class="form-control" minlength="6" required><div class="invalid-feedback">Password must be at least 6 characters.</div></div>
    <button class="btn btn-nest w-100">Log in</button>
    <div id="msg" class="mt-3 text-success" aria-live="polite"></div>
    <p class="mt-3 mb-0 text-center">New here? <a href="signup.html">Create an account</a></p>
  </form>
</div>
<script src="script.js"></script>
</body>
</html>
