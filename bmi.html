<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI and Calories - IronNest Fitness</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<header class="banner"><div class="container"><h1>BMI and calorie calculator</h1><p class="lead mb-0">Know your numbers, then pick the right plan.</p></div></header>
<section class="py-5">
  <div class="container" style="max-width:760px">
    <form id="bmiForm" novalidate>
      <div class="row g-3">
        <div class="col-6"><label for="h" class="form-label">Height (cm)</label><input id="h" type="number" class="form-control" min="100" max="250" placeholder="170" required></div>
        <div class="col-6"><label for="w" class="form-label">Weight (kg)</label><input id="w" type="number" class="form-control" min="30" max="250" placeholder="70" required></div>
        <div class="col-6"><label for="age" class="form-label">Age</label><input id="age" type="number" class="form-control" min="14" max="90" placeholder="25" required></div>
        <div class="col-6"><label for="sex" class="form-label">Gender</label><select id="sex" class="form-select"><option value="m">Male</option><option value="f">Female</option></select></div>
        <div class="col-md-6"><label for="act" class="form-label">Activity level</label><select id="act" class="form-select"><option value="1.2">Little or no exercise</option><option value="1.375">Light, 1 to 3 days a week</option><option value="1.55" selected>Moderate, 3 to 5 days a week</option><option value="1.725">Heavy, 6 to 7 days a week</option></select></div>
        <div class="col-md-6"><label for="goal" class="form-label">Goal</label><select id="goal" class="form-select"><option value="-400">Lose weight</option><option value="0" selected>Stay fit</option><option value="400">Gain muscle</option></select></div>
      </div>
      <button class="btn btn-nest w-100 mt-3">Calculate</button>
    </form>
    <div id="result" class="result mt-4" aria-live="polite" style="background:var(--chalk)"></div>
    <p class="small text-secondary mt-3">These are general estimates and not medical advice. Ask your doctor before starting a new diet or exercise plan.</p>
  </div>
</section>

<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout.js"></script>
<script src="script.js"></script>
</body>
</html>
